server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Inherited by every location below, as long as none of them sets its own add_header.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # The browser talks to one origin, as in development where Vite proxies the same path,
    # so the API needs no CORS. The trailing slash strips the /api prefix.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # File names carry a content hash, so a cached copy can never be stale.
    location /assets/ {
        expires max;
    }

    # Client-side routes such as /tickets/<id> all load the app; index.html itself is
    # revalidated so a deploy reaches people on their next visit.
    location / {
        try_files $uri /index.html;
        expires epoch;
    }
}
