name: frontend

on:
  push:
    paths: &frontend-paths
      - "frontend/**"
      # The generated API types come from the backend's routes and models.
      - "backend/src/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths: *frontend-paths

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  api-types:
    # Fails when the backend's API changed but the committed schema and types weren't
    # regenerated, so the frontend can't silently drift from what the server accepts.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: npm ci

      - name: Regenerate
        run: npm run api:generate

      - name: Compare with the committed files
        run: |
          git diff --exit-code -- openapi.json src/api/schema.d.ts \
            || { echo "::error::API types are stale; run 'npm run api:generate' in frontend/"; exit 1; }
